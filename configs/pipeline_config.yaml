# configs/pipeline_config.yaml
data:
  raw_path: data/raw/telco_churn.csv
  processed_path: data/processed/telco_clean.parquet
  target: Churn
  # customerID is an ID. gender is a sensitive attribute (fairness discussion in REPORT.md).
  drop_columns: [customerID, gender]
  test_size: 0.2   # share of all rows held out for the final test
  val_size: 0.2    # share of all rows used to compare tuning candidates
  random_state: 42