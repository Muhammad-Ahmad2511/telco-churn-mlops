# configs/model_params.yaml
model:
  name: logistic_regression
  params:
    C: 1.0
    max_iter: 1000
    class_weight: balanced

# Quality gate (initial guesses, adjust after the first run).
# A model below these values must NOT be promoted or deployed.
thresholds:
  min_recall: 0.60
  min_f1: 0.55

# Hyperparameter search used by src/models/tune.py.
# Every combination is trained on train and scored on validation.
# Winner = best validation F1 among candidates that reach min_recall.
tuning:
  selection_metric: f1
  candidates:
    logistic_regression:
      C: [0.1, 1.0, 10.0]
    random_forest:
      n_estimators: [300]
      max_depth: [8, 16]
      min_samples_leaf: [1, 5]
    hist_gradient_boosting:
      learning_rate: [0.05, 0.1]
      max_depth: [3, 6]

# Controlled promotion used by src/models/promote.py (manual command, never automatic).
# Both models are re-scored on the same test rows. The candidate replaces production only if:
#   it passes the quality gate AND f1 >= prod_f1 + min_f1_gain AND recall >= prod_recall - max_recall_drop
promotion:
  candidate_alias: candidate
  production_alias: production
  min_f1_gain: 0.005
  max_recall_drop: 0.02

mlflow:
  experiment_name: telco-churn
registry:
  model_name: telco-churn-classifier