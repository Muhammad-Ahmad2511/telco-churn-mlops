# k8s/api-service.yaml - stable address in front of all API pods.
# kube-proxy spreads requests across every pod that passes its readiness probe.
# With k8s/kind-cluster.yaml, NodePort 30500 is reachable on the laptop at http://127.0.0.1:5050
apiVersion: v1
kind: Service
metadata:
  name: telco-churn-api
  labels:
    app: telco-churn-api
spec:
  type: NodePort
  selector:
    app: telco-churn-api
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
