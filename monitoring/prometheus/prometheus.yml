# monitoring/prometheus/prometheus.yml
# Scrapes the churn API's /metrics endpoint (src/serving/metrics.py).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: telco-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]   # docker-compose service name
        labels:
          service: telco-churn-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
